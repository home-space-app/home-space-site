<!doctype html>
<!-- Source for src/og-image.png (1200x630). Regenerate with: node tools/render-og.js -->
<html lang="en"><head><meta charset="utf-8">
<style>
  html,body{margin:0}
  body{width:1200px;height:630px;overflow:hidden;background:#0e1014;color:#e7e9ec;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;position:relative}
  .glow{position:absolute;inset:-200px auto auto -150px;width:800px;height:800px;
    background:radial-gradient(closest-side,rgb(109 158 255/.28),transparent);}
  .text{position:absolute;left:72px;top:72px;width:520px}
  .brand{display:flex;align-items:center;gap:16px;font-size:34px;font-weight:650}
  .brand img{width:56px;height:56px}
  h1{font-size:62px;line-height:1.05;letter-spacing:-.02em;margin:56px 0 24px}
  h1 em{font-style:normal;color:#6d9eff}
  p{font-size:26px;line-height:1.35;color:#98a1b0;margin:0}
  .tags{position:absolute;left:72px;bottom:64px;display:flex;gap:12px}
  .tags span{border:1px solid #353b46;border-radius:999px;padding:8px 18px;font-size:20px;color:#c9ced6}
  .shot{position:absolute;left:640px;top:110px;width:720px;border-radius:14px;overflow:hidden;
    border:1px solid #353b46;box-shadow:0 30px 80px rgb(0 0 0/.55)}
  .shot img{display:block;width:100%}
</style></head><body>
<div class="glow"></div>
<div class="text">
  <div class="brand"><img src="../src/favicon.svg" alt="">Home Space</div>
  <h1>Your files, in <em>your own</em> space.</h1>
  <p>Open-source, self-hosted cloud storage. A private Google Drive alternative.</p>
</div>
<div class="tags"><span>Docker</span><span>Web</span><span>Desktop</span><span>Android</span><span>iOS</span></div>
<div class="shot"><img src="../src/screens/web-files-dark.webp" alt=""></div>
</body></html>
